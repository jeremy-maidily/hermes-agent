name: Windows venv-holder live E2E

# TEMPORARY PROOF WORKFLOW (wine2e/winstage-* branches only; never merges):
# runs the Windows hand-off child-stage tests on a real Windows runner.

on:
  push:
    branches:
      - 'wine2e/**'

permissions:
  contents: read

jobs:
  winstage-proof:
    name: winstage proof (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: blacksmith-32vcpu-windows-2025
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1

      - name: Set up locked Python and test dependencies
        timeout-minutes: 20
        uses: ./.github/actions/setup-pm
        with:
          packages: 'git,ripgrep'
          extras: '["all", "telegram", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run child-stage tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          scripts/run_tests.sh tests/scripts/desktop_update/diag/ -- \
            -m "platforms and not integration" -v --tb=short
          rc=$?
          echo "=== DIAG RECORDS ==="
          for f in diag-out/*.json; do echo "REC $(cat "$f")"; done
          exit $rc
